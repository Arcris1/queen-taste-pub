<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FDF4E0" />
  <meta name="description" content="Queen Taste &amp; Pub — Feel Good · Eat Fresh · Live Well. Coffee, iced tea, Korean noodles, silog and rice meals, sizzling plates, beers and soju in Talon Tres, Las Piñas." />
  <title>Queen Taste &amp; Pub · Menu</title>
  <link rel="icon" type="image/png" href="images/queen-taste-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202609242250" />
</head>
<body>

  <!-- HERO -->
  <header class="hero">
    <div class="hero-inner frame reveal">
      <i class="node tl" aria-hidden="true"></i>
      <i class="node tr" aria-hidden="true"></i>
      <i class="node bl" aria-hidden="true"></i>
      <i class="node br" aria-hidden="true"></i>

      <img class="logo" src="images/queen-taste-logo.png" width="320" height="200"
           alt="Queen Taste &amp; Pub" />

      <p class="tagline">Korean &amp; Filipino kitchen · coffee bar · pub</p>

      <div class="rule" aria-hidden="true"><i></i></div>

      <p class="location">
        <b>Lotus St. cor. Gladiola</b>Talon Tres, Las Piñas City
      </p>
    </div>
  </header>

  <!-- MENU -->
  <main class="menu">
    <p class="lede reveal" style="--i:1">Eleven pages. Tap one to read it full size — pinch to zoom.</p>

    <section aria-labelledby="sip">
      <div class="ribbon reveal" style="--i:2"><h2 id="sip">Sip</h2></div>
      <div class="grid" id="gridSip"></div>
    </section>

    <section aria-labelledby="eat">
      <div class="ribbon"><h2 id="eat">Eat</h2></div>
      <div class="grid" id="gridEat"></div>
    </section>

    <section aria-label="Ice &amp; Chill">
      <div id="featureSlot"></div>
    </section>

    <div class="colophon">
      <div class="rule" aria-hidden="true"><i></i></div>
      <p>Queen Taste &amp; Pub</p>
    </div>
  </main>

  <!-- CONTACT -->
  <nav class="footer-bar" aria-label="Contact">
    <a class="action call" href="tel:+639457168208" aria-label="Call Queen Taste and Pub at 0945 716 8208">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      0945 716 8208
    </a>
    <a class="action fb" href="https://www.facebook.com/profile.php?id=61578332574458" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.78-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.25 0-1.63.77-1.63 1.56V12h2.78l-.45 2.89h-2.33v6.99A10 10 0 0 0 22 12z"/></svg>
      Facebook
    </a>
  </nav>

  <!-- FULL-SIZE PAGE VIEWER -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Menu page viewer" hidden>
    <button class="lb-close" id="lbClose" aria-label="Close">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>

    <div class="lb-title" id="lbTitle"></div>
    <div class="lb-counter" id="lbCounter"></div>

    <button class="lb-nav prev" id="lbPrev" aria-label="Previous page">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18 9 12l6-6"/></svg>
    </button>
    <button class="lb-nav next" id="lbNext" aria-label="Next page">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>

    <div class="lb-stage" id="lbStage">
      <img id="lbImg" alt="" />
    </div>

    <div class="lb-dots" id="lbDots" aria-hidden="true"></div>
  </div>

  <script src="script.js?v=202609242250"></script>
</body>
</html>
