server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Behind Caddy nginx only sees plain HTTP; relative redirects keep https.
    absolute_redirect off;
    port_in_redirect off;

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # HTML is small and must refresh when the menu changes.
    location ~* \.html?$ {
        add_header Cache-Control "no-cache";
    }

    # CSS/JS are cache-busted with ?v= by deploy.ps1; posters are replaced
    # in place, so keep them short-lived rather than immutable.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000";
    }
    location ~* \.(png|jpe?g|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=3600";
    }
}
